tools:
  dozzle:
    host: logs.hostingfrompurva.xyz
    target: /

    auth:
      required: true
      role: admin

      # IMPORTANT: allow internal Dozzle calls
      allowPaths:
        - /assets/*
        - /favicon.ico
        - /api/*
        - /api/events/stream
        - /ws
        - /sockjs/*
        - /health

  netdata:
    host: metrics.hostingfrompurva.xyz
    target: /

    auth:
      required: true
      role: admin

      allowPaths:
        - /api/*
        - /netdata/*
        - /ws

  filebrowser:
    host: files.hostingfrompurva.xyz
    target: /

    auth:
      required: true
      role: admin
    allowPaths:
      - /assets/*
      - /favicon.ico
      - /api/*
      - /ws
      - /health

  jellyfin:
    host: moviescloud.hostingfrompurva.xyz
    target: /web/index.html

    auth:
      required: true
      allowedEmails:
        - anikeshthakur85@gmail.com

      allowedHeaders:
        - name: "Authorization"
          contains: "MediaBrowser"
        - name: "X-Emby-Authorization"
          contains: "MediaBrowser"  

      allowPaths:
        # Static UI
        - /web/*
        - /css/*
        - /fonts/*
        - /images/*
        - /favicon.ico    