tools:
  dozzle:
    host: logs.hostingfrompurva.xyz
    target: /

    auth:
      required: true
      role: admin

      # IMPORTANT: allow internal Dozzle calls
      allowPaths:
        - /assets/*
        - /favicon.ico
        - /api/*
        - /api/events/stream
        - /ws
        - /sockjs/*
        - /health

  netdata:
    host: metrics.hostingfrompurva.xyz
    target: /

    auth:
      required: true
      role: admin

      allowPaths:
        - /api/*
        - /netdata/*
        - /ws

jellyfin:
  host: moviescloud.hostingfrompurva.xyz
  target: http://127.0.0.1:9001

  auth:
    required: true

    allowedEmails:
      - anikeshthakur85@gmail.com

    allowPaths:
      # Static UI assets
      - /web/*
      - /css/*
      - /fonts/*
      - /images/*
      - /favicon.ico

      # WebSocket bootstrap (still authenticated later)
      - /socket