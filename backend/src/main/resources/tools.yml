tools:
  jellyfin:
    host: moviescloud.hostingfrompurva.xyz
    target: /web/index.html

    auth:
      required: true

      allowedEmails:
        - anikeshthakur85@gmail.com

      allowedHeaders:
        - name: "Authorization"
          contains: "MediaBrowser"
        - name: "X-Emby-Authorization"
          contains: "MediaBrowser"  

      allowPaths:
        # Static UI
        - /web/*
        - /css/*
        - /fonts/*
        - /images/*
        - /favicon.ico

        # Jellyfin bootstrap
        - /System/Info/Public
        - /System/Configuration
        - /branding/*

        # Jellyfin login
        - /Users/AuthenticateByName
        - /Users/Public

        - /Sessions/*
        - /DisplayPreferences
        - /System/*
        - /Playback/*


        # WebSockets
        - /socket